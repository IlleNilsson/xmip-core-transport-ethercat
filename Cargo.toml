[package]
name = "xmip-core-transport-ethercat"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-ethercat"
description = "EtherCAT transport: IEC 61158 Type 12 over raw Ethernet — datagrams with command, index, address, length and working counter, several to a frame, and a CoE mailbox transfer for a Stream larger than one. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main", optional = true }
# The `0x` number a target names (`codec::hex`).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The one refusal of a size over a ceiling (`net::ceiling`), and a target
# read as a URI (`net::Target`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The carrier, declared in architecture.toml: the link, the frame and the
# loopback every Layer 2 protocol rides on come from ethernet, never copied.
# The code's alone: the declaration takes none of ethernet's settings.
ethernet = { package = "xmip-core-transport-ethernet", git = "https://github.com/IlleNilsson/xmip-core-transport-ethernet", branch = "main", optional = true }
# CoE is CANopen's application layer in the mailbox (ETG.1000.6 section 5.6):
# the SDO, its client and its server are the canopen technology's, and only
# the mailbox and its window are this crate's. The declaration takes the
# dictionary's `index` and `subindex` from canopen's; the code, the rest.
canopen = { package = "xmip-core-transport-canopen", git = "https://github.com/IlleNilsson/xmip-core-transport-canopen", branch = "main", default-features = false }

[features]
# The technology: its code, everything it is built on, and its declaration.
# Without it the crate is its declaration alone (ADR-0064, amendments
# 2026-10-22 and 2026-11-26).
default = [
    "declaration",
    "dep:context",
    "dep:codec",
    "dep:net",
    "dep:ethernet",
    "canopen/default",
]
# The declaration alone: what a Location of this technology is configured
# with, `declaration::SETTINGS` and `SCHEMES`, with the object a Stream
# travels as and the wait a Location takes unless it says, and none of the
# code — what the surfaces' library is to carry (open problem 48).
declaration = ["canopen/declaration"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
